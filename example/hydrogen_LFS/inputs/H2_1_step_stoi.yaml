#**************************************************************************************
#
# One step chemistry model for H2 combustion
# - Description: Template to fit against FFCM2H2.yml LFS and flame thickness at these conditions:
#   P(atm)      T(K)        phi
#   10          473         0.25
#   15.2488     548.6381    0.25
#   20.2549     605.9563    0.25
#   25.1221     653.2179    0.25
#   29.8923     693.9191    0.25
#   34.5875     729.9276    0.25
# 
# - Oxidizer: O2:1,Ar:3.752
# - Fuel:     H2:1
#
# **************************************************************************************

units: {length: cm, quantity: mol, activation-energy: cal/mol}

phases:
- name: gas
  thermo: ideal-gas
  elements: [H, O, Ar]
  species: [H2, O2, H2O, AR]
  kinetics: gas
  reactions: all
  transport: mixture-averaged
  state:
    T: 300.0
    P: 1.01325e+05

species:
- name: H2
  composition: {H: 2}
  thermo:
    model: NASA7
    temperature-ranges: [200.0, 1000.0, 6000.0]
    data:
    - [2.34433112, 7.98052075e-03, -1.9478151e-05, 2.01572094e-08, -7.37611761e-12,
      -917.935173, 0.683010238]
    - [2.93286575, 8.26608026e-04, -1.46402364e-07, 1.54100414e-11, -6.888048e-16,
      -813.065581, -1.02432865]
  transport:
    model: gas
    geometry: linear
    diameter: 2.92
    well-depth: 38.0
    polarizability: 0.79
    rotational-relaxation: 280.0
- name: O2
  composition: {O: 2}
  thermo:
    model: NASA7
    temperature-ranges: [200.0, 1000.0, 6000.0]
    data:
    - [3.78245636, -2.99673416e-03, 9.84730201e-06, -9.68129509e-09, 3.24372837e-12,
      -1063.94356, 3.65767573]
    - [3.66096065, 6.56365811e-04, -1.41149627e-07, 2.05797935e-11, -1.29913436e-15,
      -1215.97718, 3.41536279]
  transport:
    model: gas
    geometry: linear
    diameter: 3.458
    well-depth: 107.4
    polarizability: 1.6
    rotational-relaxation: 3.8
    collision-integral: 1.0
- name: H2O
  composition: {H: 2, O: 1}
  thermo:
    model: NASA7
    temperature-ranges: [200.0, 1000.0, 6000.0]
    data:
    - [4.1986352, -2.0364017e-03, 6.5203416e-06, -5.4879269e-09, 1.771968e-12,
      -3.0293726e+04, -0.84900901]
    - [2.6770389, 2.9731816e-03, -7.7376889e-07, 9.4433514e-11, -4.2689991e-15,
      -2.9885894e+04, 6.88255]
  transport:
    model: gas
    geometry: nonlinear
    diameter: 2.605
    well-depth: 572.4
    dipole: 1.844
    rotational-relaxation: 4.0
- name: AR
  composition: {Ar: 1}
  thermo:
    model: NASA7
    temperature-ranges: [200.0, 1000.0, 6000.0]
    data:
    - [2.5, 0.0, 0.0, 0.0, 0.0, -745.375, 4.37967491]
    - [2.5, 0.0, 0.0, 0.0, 0.0, -745.375, 4.37967491]
  transport:
    model: gas
    geometry: atom
    diameter: 3.33
    well-depth: 136.5
  
reactions:
- equation: 2 H2 + O2 => 2 H2O  # Global Reaction
  rate-constant: {A: 1.0e+14, b: 1.0, Ea: 15000.0}
  orders: {H2: 1.0, O2: 1.0}
